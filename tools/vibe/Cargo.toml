[package]
name = "vibe-cli"
version = "0.1.0"
edition = "2021"
description = "Vibe Engine command-line tool"
license = "MIT"

[[bin]]
name = "vibe"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
clap = { version = "=4.4.18", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
walkdir = "2.5"
